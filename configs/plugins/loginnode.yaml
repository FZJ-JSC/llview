# ─────────────────────────────────────────────────────────────────────────────
# monitor_config.yaml
#
# Configuration for monitor_node.py.
#
# Output is machine-readable JSON, intended as input for a downstream
# system (LLview) that parses it and stores it in its own database.
# Every metric is therefore stored as a discrete, typed key. No section
# in this file produces a raw text blob bundling multiple metrics
# together — every command output that could contain more than one
# metric is parsed into separate fields before being written.
#
# Each login node runs its own copy of the script as a cron job. The
# hostname is resolved at runtime, so a single config file is shared
# across all nodes without modification.
#
# Output written to: <output.dir>/<hostname>.json
#
# Snapshot structure:
#   {
#     "timestamp":        "2025-05-21T10:00:00Z",
#     "hostname":         "login01",
#     "processes":        [ { one dict per visible process } ... ],
#     "tmp":              { /tmp usage totals and per-user breakdown },
#     "load":             { load_1m, load_5m, load_15m, running_procs, ... },
#     "memory":           { MemTotal_mb, MemFree_mb, ... },
#     "logged_in_users":  { session_count, unique_users, sessions: [...] },
#     "extra":            { name: result, ... }
#   }
#
# Every process row carries state, threads, and cpu_time_secs alongside
# cpu_pct and mem_pct, so a downstream consumer can independently identify
# long-running high-CPU processes, high-thread processes, high-memory
# processes, or processes stuck in D state directly from this one list,
# without this script needing to pre-sort them into separate categories.
# ─────────────────────────────────────────────────────────────────────────────


# ── Output ────────────────────────────────────────────────────────────────────
output:

  # Directory where output files are written. ~ is expanded to $HOME.
  # One file per hostname is created: e.g. login01.json
  dir: ~/node_monitor_logs

  # When false (default), the output file is overwritten on every run so
  # it always reflects the current state of the node.
  # When true, output is appended as JSONL (one line per run) and the
  # extension changes to .jsonl.
  append: false


# ── Process table ─────────────────────────────────────────────────────────────
#
# field_map defines which fields are collected in a single ps(1) call and
# what each field is named in the output.
#
# The left side is the output name (the JSON key); the right side is the
# ps(1) -o keyword. To remove a field, delete its line from field_map.
# To rename a field in the output, change the left side only. To collect
# a different ps metric, change the right side to any valid ps -o keyword
# (see man ps).
#
# The field whose ps keyword is 'args' (full command line) is moved to
# the end of the ps format string automatically, regardless of where it
# appears here, because ps writes args as a trailing space-containing column.
#
processes:
  enabled: true

  # Output field name used to sort processes in descending order.
  # Must match a key in field_map below.
  sort_by: cpu_pct

  # Maximum number of processes retained after sorting and filtering.
  # When absent or set to 0, all processes are kept.
  # top_n: 50

  # Processes below these thresholds are excluded.
  # When absent or set to 0, no threshold is applied.
  # min_cpu_pct: 0.1
  # min_mem_pct: 0.1

  # Field mapping: output_name: ps_keyword
  #
  # Output name       ps keyword   Meaning
  # ─────────────── ─────────── ──────────────────────────────────────────────
  # pid               pid          Unique process identifier assigned by the kernel.
  #                                Stable for the lifetime of the process.
  #
  # ppid              ppid         Parent process ID. Useful for reconstructing
  #                                the process tree (e.g. shell → user program).
  #
  # user              user:32      Username of the process owner. The :32 suffix
  #                                sets the ps column width to avoid truncation of
  #                                long usernames; it does not appear in the output.
  #
  # name              comm         Short executable name without path or arguments
  #                                (e.g. "python3"). Truncated by the kernel at 15
  #                                characters for some process types.
  #
  # cmd               args         Full command line as passed to execve, including
  #                                all arguments (e.g. "python3 train.py --lr 0.01").
  #                                May be empty for kernel threads.
  #
  # state             stat         Process state code. Common values:
  #                                  R  running or runnable (on the run queue)
  #                                  S  interruptible sleep (waiting for an event)
  #                                  D  uninterruptible sleep, usually I/O wait —
  #                                     often a sign of storage or network filesystem
  #                                     trouble when many processes accumulate here
  #                                  Z  zombie (terminated, waiting for parent to wait())
  #                                  T  stopped (by a signal or debugger)
  #                                  I  idle kernel thread
  #                                Additional characters may follow (e.g. 'Ss', 'Rl').
  #
  # cpu_pct           pcpu         CPU usage as a percentage of one core, averaged
  #                                over the process lifetime by ps. May exceed 100%
  #                                on multi-core machines for multi-threaded programs.
  #
  # mem_pct           pmem         Resident set size as a percentage of total physical
  #                                memory installed on the machine.
  #
  # mem_rss_mb        rss          Resident Set Size in MB. The portion of the process's
  #                                memory that is held in physical RAM. This is the most
  #                                meaningful memory figure for capacity planning.
  #
  # mem_vsz_mb        vsz          Virtual memory size in MB. Includes all mapped regions:
  #                                anonymous memory, memory-mapped files, shared libraries.
  #                                Usually much larger than rss and less indicative of
  #                                actual RAM pressure.
  #
  # threads           nlwp         Number of threads (light-weight processes) in the
  #                                process. Values > 1 indicate multi-threaded programs
  #                                such as OpenMP, MPI, or Java applications.
  #
  # elapsed           etime        Wall-clock time elapsed since the process started,
  #                                in the format [[DD-]HH:]MM:SS. Reflects how long the
  #                                process has existed, not how much CPU it has used.
  #
  # cpu_time_secs     times        Cumulative CPU time consumed by the process, in
  #                                seconds. Unlike elapsed, this reflects actual CPU
  #                                usage: a process idle for days has a large elapsed
  #                                time but a small cpu_time_secs, while a process that
  #                                saturates multiple cores accumulates cpu_time_secs
  #                                faster than wall-clock time passes.
  #
  # priority          pri          Kernel scheduling priority. Higher values mean lower
  #                                priority in most display conventions. Affected by
  #                                the nice value and real-time scheduling policies.
  #
  # nice              nice         Nice value in the range -20 (highest priority) to
  #                                +19 (lowest priority). Users can only raise their
  #                                own processes' nice values (i.e. lower priority).
  #
  # tty               tty          Controlling terminal. '?' means the process has no
  #                                terminal (background service or daemon). Values like
  #                                'pts/0' indicate an SSH or terminal session.
  #
  field_map:
    pid:           pid
    user:          "user:32"
    name:          comm
    state:         stat
    cpu_pct:       pcpu
    mem_pct:       pmem
    mem_rss_mb:    rss
    mem_vsz_mb:    vsz
    threads:       nlwp
    elapsed:       etime
    cpu_time_secs: times
    cmd:           args


  # Processes matching these regex patterns on specific keys are excluded.
  # This reduces noise from system daemons that are not meaningful to a downstream consumer.
  exclude:
    user:
      - "^root$"
      - "^daemon$"
      - "^nobody$"
      - "^systemd-"
      - "^messagebus$"
      - "^sshd$"
      - "^ntp$"
      - "^chrony$"
      - "^postfix$"
      - "^polkitd$"
      - "^node_exporter$"
      - "^dbus$"
      - "^nvidia-persistenced$"
      - "^nscd$"
      - "^squid$"
      - "^ljupyter$"
      - "^esm-buildbot$"
      - "^slurm$"
      - "^munge$"
      - "^nodeum_auth$"
    cmd:
      - "/usr/lib/systemd/systemd"

# ── /tmp table ────────────────────────────────────────────────────────────────
tmp:
  # Overall usage is collected with:
  #   df -B1 --output=size,used,avail,pcent /tmp
  #
  # Per-user breakdown is estimated with:
  #   find /tmp -maxdepth <per_user_find_depth> -printf '%u %s\n'
  #
  # The find command requires no elevated privileges. Entries inside
  # directories that cannot be read are silently skipped, so per-user
  # figures represent a lower bound on actual usage.
  # The overall used_mb figure from df is always accurate.
  #
  # A larger depth produces more accurate per-user totals at the cost
  # of a slower traversal on large /tmp filesystems.

  enabled: true
  per_user_find_depth: 4
  
  targets:
    # Filesystem path to monitor.
    - path: /tmp
      prefix: tmp
    - path: /dev/shm
      prefix: dev_shm

# ── Load average ──────────────────────────────────────────────────────────────
#
# Read directly from /proc/loadavg. Produces the following numeric fields:
#   load_1m, load_5m, load_15m   — averaged system load over 1/5/15 minutes
#   running_procs, total_procs   — currently runnable vs total scheduled processes
#   last_pid                     — most recently allocated process ID
#
load:
  enabled: true


# ── Memory ────────────────────────────────────────────────────────────────────
#
# Read directly from /proc/meminfo. Each field below is converted from kB
# to MB and stored as "<field>_mb".
#
memory:
  enabled: true

  # /proc/meminfo keys to collect. Any key present in /proc/meminfo is valid.
  fields:
    - MemTotal
    - MemFree
    - MemAvailable
    - Buffers
    - Cached
    - SwapTotal
    - SwapFree
    - Shmem
  # External commands outputting a single numeric value in MB can be used to subtract 
  # capacity from standard /proc/meminfo fields (e.g., for unified memory architectures).
  subtract_from_mb:
    MemTotal: "nvidia-smi --query-gpu=memory.total --format=csv,noheader,nounits | awk '{s+=$1} END {print s}'"
    MemFree: "nvidia-smi --query-gpu=memory.free --format=csv,noheader,nounits | awk '{s+=$1} END {print s}'"
    MemAvailable: "nvidia-smi --query-gpu=memory.free --format=csv,noheader,nounits | awk '{s+=$1} END {print s}'"

# ── Logged-in users ───────────────────────────────────────────────────────────
#
# Collected via:
#   who -u
#
# Each session line is parsed into distinct fields (user, tty, login_time,
# idle, pid, from) rather than kept as raw text.
#
logged_in_users:
  enabled: true


# ── Extra commands ────────────────────────────────────────────────────────────
#
# Each entry runs the exact command specified in 'cmd' and stores the result
# under snapshot["extra"][<name>].
#
# This mechanism is only suitable for commands whose output already maps
# cleanly onto one of the parse modes below. It is not suitable for
# commands whose output bundles several distinct metrics into one
# unstructured block of text (for example, `free -m` or a multi-line
# report), because a downstream parser cannot reliably split that back
# into individual metrics. Sources like that require a dedicated parser,
# similar to how load and memory are handled above.
#
# parse options:
#   raw   → { stdout: "...", stderr: "...", rc: 0 }
#           Suitable only when the entire output is a single value.
#   lines → { lines: [ "line1", ... ], rc: 0 }
#           Suitable only when each line is a single atomic value.
#   json  → the parsed JSON object from stdout directly.
#   csv   → { rows: [ { field1: val1, field2: val2, ... }, ... ], rc: 0 }
#           Splits each output line on commas and zips the values against
#           the 'fields' list. Suitable for one-record-per-line CSV output
#           with a fixed, known set of columns, such as nvidia-smi --format=csv.
#
extra_commands:

  - name: address
    enabled: true
    parse: raw
    # The command is streamed into 'sh' via stdin to safely bypass YAML and Python quoting collisions.
    # The IP list is filtered for the target subnet, and the first match is resolved to its hostname.
    cmd: bash -c "getent hosts \`hostname -I | tr ' ' '\n' | grep '^134\.94\.' | head -n 1\` | tr -s ' ' | cut -d' ' -f2"

  - name: gpu_summary
    enabled: true
    cmd: "nvidia-smi --query-gpu=index,name,utilization.gpu,memory.used,memory.total,temperature.gpu --format=csv,noheader,nounits"
    parse: csv
    fields:
      - gpu_index
      - gpu_name
      - utilization_gpu_pct
      - memory_used_mb
      - memory_total_mb
      - temperature_c
    timeout: 10
    # Injects the hardware rows directly into the main node_stat object.
    # Resulting XML keys: extra_gpu_hardware_0_utilization_gpu_pct, extra_gpu_hardware_1_utilization_gpu_pct, etc.
    inject_into: node

  - name: gpu_processes
    enabled: true
    # Hardware-specific process metrics are extracted and parsed securely.
    cmd: "nvidia-smi --query-compute-apps=pid,used_memory --format=csv,noheader,nounits"
    parse: csv
    fields:
      - pid
      - gpu_mem_used_mb
    timeout: 10
    # When true, rows containing a 'pid' field are matched against the standard 
    # process list. The extracted fields (e.g. gpu_mem_used_mb) are injected directly 
    # into the existing process object.
    inject_into: process

  - name: systemname
    enabled: true
    parse: raw
    cmd: "echo $SYSTEMNAME"

